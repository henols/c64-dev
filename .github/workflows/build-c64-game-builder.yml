name: build-c64-game-builder

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: c64-game-builder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skill
        run: python scripts/quick_validate.py .

      - name: Package skill
        run: python scripts/package_skill.py . dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: c64-game-builder-skill-zip
          path: c64-game-builder/dist/skill.zip

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: c64-game-builder/dist/skill.zip
          generate_release_notes: true
